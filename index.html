<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ac:#E63946;--bg:#0a0a0b;--sf:#131316;--sf2:#1b1b20;--sf3:#242429;
  --bd:#2a2a31;--tx:#e8e6e3;--tx2:#6e6e75;--tx3:#44444a;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html,body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100%;overflow:hidden}
button{font-family:inherit}

/* buttons */
.btn{
  font-size:13px;font-weight:600;border:1px solid var(--bd);border-radius:8px;
  padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  background:var(--sf2);color:var(--tx);outline:none;-webkit-appearance:none;
}
.btn:active{transform:scale(0.96)}
.btn-a{background:var(--ac);border-color:var(--ac);color:#fff}
.btn-s{padding:6px 10px;font-size:11px}

/* screens */
.scr{display:none;position:fixed;inset:0;flex-direction:column}
.scr.on{display:flex}

/* header */
.hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + var(--sat)) 16px 14px;
  background:var(--sf);border-bottom:1px solid var(--bd);position:relative;z-index:10;
}
.logo{font-size:21px;font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;gap:6px}
.logo b{color:var(--ac)}
.logo small{font-size:9px;font-weight:500;color:var(--tx2);letter-spacing:2px;text-transform:uppercase;margin-left:4px}
.hdr-right{display:flex;gap:6px;align-items:center}

/* settings dropdown */
.sdrop{
  position:absolute;top:calc(52px + var(--sat));right:14px;
  background:var(--sf);border:1px solid var(--bd);border-radius:12px;
  padding:4px 0;min-width:200px;z-index:101;
  box-shadow:0 12px 40px rgba(0,0,0,0.7);
}
.sdrop>div{
  padding:12px 18px;cursor:pointer;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:10px;
}
.sdrop>div:active{background:var(--sf2)}
.sdrop{max-height:calc(100dvh - 70px - var(--sat));overflow-y:auto}

/* library */
.lib-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;padding:24px}
.dz{
  border:2px dashed var(--bd);border-radius:16px;padding:48px 32px;
  text-align:center;width:85%;max-width:380px;cursor:pointer;transition:border-color 0.25s;
}
.dz.over{border-color:var(--ac)}
.dz-icon{font-size:44px;margin-bottom:14px;opacity:0.35}
.dz-t{font-size:15px;font-weight:600;margin-bottom:4px}
.dz-s{font-size:12px;color:var(--tx2)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px;padding:16px 16px calc(16px + var(--sab))}
.card{
  background:var(--sf);border-radius:10px;overflow:hidden;
  border:1px solid var(--bd);cursor:pointer;position:relative;
  transition:transform 0.15s,border-color 0.15s;-webkit-touch-callout:none;
}
.card:active{transform:scale(0.97);border-color:var(--ac)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--sf2)}
.card .ph{width:100%;aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--tx3);background:var(--sf2)}
.card .ti{padding:8px 10px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pg{padding:0 10px 10px;font-size:10px;color:var(--tx2)}
.card .bar{position:absolute;bottom:52px;left:0;right:0;height:2px;background:var(--bd)}

<script>
(function(){
"use strict";

/* ═══ DB ═══ */
var DB="KomaDB",VER=1,ST="lib";
function openDB(){
  return new Promise(function(res,rej){
    var r=indexedDB.open(DB,VER);
    r.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains(ST)) db.createObjectStore(ST,{keyPath:"id"});
    };
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  });
}
function dbPut(entry){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(ST,"readwrite");
      tx.objectStore(ST).put(entry);
      tx.oncomplete=function(){res()};
      tx.onerror=function(){rej(tx.error)};
    });
  });
}
function dbAll(){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var r=db.transaction(ST).objectStore(ST).getAll();
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
    });
  });
}
function dbDel(id){
  return openDB().then(function(db){
    return new Promise(function(res,rej){
      var tx=db.transaction(ST,"readwrite");
      tx.objectStore(ST).delete(id);
      tx.oncomplete=function(){res()};
      tx.onerror=function(){rej(tx.error)};
    });
  });
}

function b64(blob){
  return new Promise(function(r){
    var f=new FileReader();
    f.onload=function(){r(f.result)};
    f.readAsDataURL(blob);
  });
}

// Blob URL cache - create object URLs on demand, track for cleanup
var urlCache={};
function getBlobUrl(blob){
  if(!blob) return "";
  // blobs don't have stable IDs, use a WeakRef-like approach
  // just create a new one each time and let callers manage
  return URL.createObjectURL(blob);
}
function blobToUrl(blob){
  if(!blob) return "";
  if(typeof blob==="string") return blob; // legacy data URL
  return URL.createObjectURL(blob);
}

function filesToBlobs(files){
  return Array.from(files).sort(function(a,b){
    return a.name.localeCompare(b.name,undefined,{numeric:true});
  }).map(function(f){return {name:f.name, blob:f}});
}

function init(){
  dbAll().then(function(items){
    var hasSortOrder=items.some(function(m){return typeof m.sortOrder==="number"});
    if(hasSortOrder) lib=items.sort(function(a,b){return(a.sortOrder||0)-(b.sortOrder||0)});
    else lib=items.sort(function(a,b){return(b.addedAt||0)-(a.addedAt||0)});
    renderLib();
  }).catch(function(){renderLib()});
}

function renderLib(){
  var folderBar=$("folderBar");
  var items;
  if(openFolder){
    folderBar.style.display="flex";
    var crumbs=folderStack.map(function(f){return f.name}).concat([openFolder.name]);
    $("folderBarName").textContent=crumbs.join(" > ");
    items=[];
    (openFolder.children||[]).forEach(function(cid){
      var found=lib.find(function(m){return m.id===cid});
      if(found) items.push(found);
    });
    addBtn.style.display="none";
    menuBtn.style.display="none";
  }else{
    folderBar.style.display="none";
    addBtn.style.display="";
    menuBtn.style.display="";
    var inFolderMap={};
    lib.forEach(function(m){
      if(m.type==="folder"&&m.children){
        m.children.forEach(function(cid){inFolderMap[cid]=true});
      }
    });
    items=lib.filter(function(m){return !inFolderMap[m.id]});

  if(searchQuery&&!openFolder){
    // Search across entire library, including items inside folders
    items=lib.filter(function(m){return m.name.toLowerCase().indexOf(searchQuery)>=0});

    items=items.filter(function(m){return m.name.toLowerCase().indexOf(searchQuery)>=0});

function getCoverUrl(m){
  if(!m) return "";
  if(m.coverBlob) return blobToUrl(m.coverBlob);
  if(m.cover) return m.cover;// legacy data URL
  if(m.images&&m.images.length>0){
    var first=m.images[0];
    if(first.blob) return blobToUrl(first.blob);
    if(first.url) return first.url;
  }
  return "";
}

function setCoverImages(items){
  // manga covers
  var thumbImgs=grid.querySelectorAll(".card-thumb-img");
  for(var j=0;j<thumbImgs.length;j++){
    var ci=parseInt(thumbImgs[j].getAttribute("data-ci"));
    var m=items[ci];
    if(m) thumbImgs[j].src=getCoverUrl(m);
  }
  // folder mini previews
  var fgrids=grid.querySelectorAll(".folder-mini-grid");
  for(var j=0;j<fgrids.length;j++){
    var fi=parseInt(fgrids[j].getAttribute("data-fi"));
    var folder=items[fi];
    if(!folder||folder.type!=="folder") continue;
    var kids=folder.children||[];
    var phs=fgrids[j].querySelectorAll(".fmini-ph");
    for(var k=0;k<Math.min(4,kids.length);k++){
      var child=lib.find(function(x){return x.id===kids[k]});
      if(child){
        var url=getCoverUrl(child);
        if(url){
          var img=document.createElement("img");
          img.src=url;img.draggable=false;
          img.style.cssText="width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px";
          phs[k].parentNode.replaceChild(img,phs[k]);
        }
      }
    }
  }
}

var dragState={active:false,dragId:null,ghost:null,items:null,scrollEl:null,autoScrollId:null,offsetY:0,busy:false,dragRow:null};
var boundMove=null,boundEnd=null;

function cleanupDragListeners(){
  if(boundMove){document.removeEventListener("touchmove",boundMove);boundMove=null}
  if(boundEnd){document.removeEventListener("touchend",boundEnd);boundEnd=null}
  clearInterval(dragState.autoScrollId);
  dragState.autoScrollId=null;
  if(dragState.ghost&&dragState.ghost.parentNode){
    dragState.ghost.parentNode.removeChild(dragState.ghost);
  }
  dragState.ghost=null;
  dragState.active=false;
  dragState.dragId=null;
  dragState.dragRow=null;
}

function renderReorderList(items){
  cleanupDragListeners();
  emptyState.style.display="none";grid.style.display="block";
  var h='<div class="reorder-list">';
  for(var i=0;i<items.length;i++){
    var m=items[i];
    h+='<div class="reorder-item" data-id="'+m.id+'">';
    h+='<div class="ri-grip">☰</div>';
    if(m.type==="folder") h+='<div class="ri-ph">📁</div>';
    else h+='<img class="ri-thumb" data-rid="'+m.id+'" src="" draggable="false">';
    h+='<div class="ri-name">'+esc(m.name)+'</div></div>';
  }
  h+='</div>';
  grid.innerHTML=h;
  grid.querySelectorAll(".ri-thumb").forEach(function(img){
    var f=items.find(function(x){return x.id===img.getAttribute("data-rid")});
    if(f) img.src=getCoverUrl(f);
  });
  dragState.items=items;dragState.scrollEl=$("libScroll");
  boundMove=function(e){handleReorderMove(e)};
  boundEnd=function(e){handleReorderEnd(e)};
  document.addEventListener("touchmove",boundMove,{passive:false});
  document.addEventListener("touchend",boundEnd,{passive:true});
  document.addEventListener("mousemove",boundMove,{passive:false});
  document.addEventListener("mouseup",boundEnd,{passive:true});
  grid.querySelectorAll(".reorder-item").forEach(function(row){
    function startDrag(e){
      if(dragState.active||dragState.busy)return;
      if(e.touches&&e.touches.length!==1)return;
      e.preventDefault();
      var y=getEventY(e);
      var dragId=row.getAttribute("data-id");
      var rect=row.getBoundingClientRect();
      dragState.active=true;dragState.dragId=dragId;
      dragState.offsetY=y-rect.top;dragState.dragRow=row;
      row.style.height=row.offsetHeight+"px";row.style.overflow="hidden";
      requestAnimationFrame(function(){
        row.style.height="0px";row.style.padding="0";
        row.style.margin="0";row.style.border="none";row.style.opacity="0";
      });
      var ghost=document.createElement("div");
      ghost.className="reorder-ghost";
      ghost.style.cssText="width:"+rect.width+"px;left:"+rect.left+"px;top:"+(y-dragState.offsetY)+"px";
      var gm=items.find(function(x){return x.id===dragId});
      ghost.textContent=gm?gm.name:"";
      document.body.appendChild(ghost);dragState.ghost=ghost;
    }
    row.addEventListener("touchstart",startDrag,{passive:false});
    row.addEventListener("mousedown",startDrag);
  });
}

function getEventY(e){
  if(e.touches&&e.touches[0]) return e.touches[0].clientY;
  if(e.changedTouches&&e.changedTouches[0]) return e.changedTouches[0].clientY;
  return e.clientY;
}

function getDropTargetId(touchY){
  var rows=[];
  grid.querySelectorAll(".reorder-item").forEach(function(el){
    var rid=el.getAttribute("data-id");
    if(rid===dragState.dragId)return;
    var r=el.getBoundingClientRect();
    if(r.height>0) rows.push({id:rid,mid:(r.top+r.bottom)/2});
  });
  if(!rows.length) return null;
  if(touchY<=rows[0].mid) return rows[0].id;
  if(touchY>=rows[rows.length-1].mid) return null;
  for(var s=0;s<rows.length-1;s++){
    if(touchY>rows[s].mid&&touchY<=rows[s+1].mid) return rows[s+1].id;
  }
  return null;
}

function handleReorderMove(e){
  if(!dragState.active||!dragState.ghost)return;
  e.preventDefault();
  var y=getEventY(e);
  dragState.ghost.style.top=(y-dragState.offsetY)+"px";
  var sr=dragState.scrollEl.getBoundingClientRect(),ez=60;
  clearInterval(dragState.autoScrollId);dragState.autoScrollId=null;
  if(y<sr.top+ez){var sp=Math.max(3,(ez-(y-sr.top))/2);dragState.autoScrollId=setInterval(function(){dragState.scrollEl.scrollTop-=sp},16);}
  else if(y>sr.bottom-ez){var sp=Math.max(3,(ez-(sr.bottom-y))/2);dragState.autoScrollId=setInterval(function(){dragState.scrollEl.scrollTop+=sp},16);}
  var tid=getDropTargetId(y);
  grid.querySelectorAll(".reorder-item").forEach(function(el){
    el.classList.toggle("drag-over",el.getAttribute("data-id")===tid);
  });
}

function handleReorderEnd(e){
  if(!dragState.active)return;
  clearInterval(dragState.autoScrollId);dragState.autoScrollId=null;
  var dragId=dragState.dragId;
  var targetId=getDropTargetId(getEventY(e));
  if(dragState.ghost&&dragState.ghost.parentNode) dragState.ghost.parentNode.removeChild(dragState.ghost);
  dragState.ghost=null;dragState.active=false;dragState.dragId=null;dragState.dragRow=null;
  reorderMove(dragId,targetId);
}

function reorderMove(dragId,targetId){
  if(dragId===targetId){renderLib();return}
  if(openFolder){
    var kids=openFolder.children||[];
    var fp=kids.indexOf(dragId);if(fp<0){renderLib();return}
    kids.splice(fp,1);
    if(targetId===null) kids.push(dragId);
    else{var tp=kids.indexOf(targetId);if(tp<0)kids.push(dragId);else kids.splice(tp,0,dragId);}
    openFolder.children=kids;
    dbPut(openFolder).then(function(){lib=lib.map(function(m){return m.id===openFolder.id?openFolder:m});renderLib();});
  }else{
    var fp=-1;for(var i=0;i<lib.length;i++){if(lib[i].id===dragId){fp=i;break}}
    if(fp<0){renderLib();return}
    var mv=lib.splice(fp,1)[0];
    if(targetId===null) lib.push(mv);
    else{var tp=-1;for(var i=0;i<lib.length;i++){if(lib[i].id===targetId){tp=i;break}}
      if(tp<0)lib.push(mv);else lib.splice(tp,0,mv);}
    saveLibOrder();renderLib();
  }
}

function bindCards(items){
  var cards=grid.querySelectorAll(".card");
  for(var j=0;j<cards.length;j++){
    (function(card){
      var idx=parseInt(card.getAttribute("data-i"));
      var cardId=card.getAttribute("data-id");
      var isFolder=card.getAttribute("data-type")==="folder";

      card.addEventListener("click",function(){
        if(selectMode){
          toggleSelect(cardId);
          return;
        }
        if(isFolder){
          openFolderView(items[idx]);
        }else{
          var realIdx=lib.indexOf(items[idx]);
          if(realIdx>=0) openReader(realIdx);
        }
      });
      card.addEventListener("contextmenu",function(e){
        e.preventDefault();
        if(selectMode) return;
        showCtx(e,idx,items);
      });
      card.addEventListener("touchstart",function(e){
        var capturedIdx=idx;var capturedItems=items;var capturedId=cardId;
        lpTmr=setTimeout(function(){
          if(selectMode) return;
          enterSelectMode(capturedId);
        },500);
      },{passive:true});
      card.addEventListener("touchend",function(){clearTimeout(lpTmr)});
      card.addEventListener("touchmove",function(){clearTimeout(lpTmr)});
    })(cards[j]);
  }
}


function getFilteredMainItems(){
  var inFolder={};
  lib.forEach(function(m){
    if(m.type==="folder"&&m.children){
      m.children.forEach(function(cid){inFolder[cid]=true});
    }
  });
  return lib.filter(function(m){return !inFolder[m.id]});
}

// Get all ancestor folder IDs for a given folder to prevent circular nesting
function getAncestorIds(folderId){
  var ancestors={};
  function walk(fid){
    lib.forEach(function(m){
      if(m.type==="folder"&&m.children&&m.children.indexOf(fid)>=0&&!ancestors[m.id]){
        ancestors[m.id]=true;
        walk(m.id);
      }
    });
  }
  walk(folderId);
  return ancestors;
}

// Get all descendant IDs (folders + manga) under a folder
function getDescendantIds(folderId){
  var desc={};
  function walk(fid){
    var f=lib.find(function(m){return m.id===fid});
    if(!f||!f.children) return;
    f.children.forEach(function(cid){
      if(!desc[cid]){desc[cid]=true;walk(cid);}
    });
  }
  walk(folderId);
  return desc;
}

function enterSelectMode(firstId){
  selectMode=true;
  selectedIds={};
  if(firstId) selectedIds[firstId]=true;
  $("selectBanner").classList.add("on");
  updateSelectCount();
  renderLib();
}
function exitSelectMode(){
  selectMode=false;
  selectedIds={};
  $("selectBanner").classList.remove("on");
  renderLib();
}
function toggleSelect(id){
  if(selectedIds[id]) delete selectedIds[id];
  else selectedIds[id]=true;
  updateSelectCount();
  // update checkboxes without full re-render
  var checks=grid.querySelectorAll(".card-select-check");
  for(var i=0;i<checks.length;i++){
    var sid=checks[i].getAttribute("data-sid");
    checks[i].classList.toggle("on",!!selectedIds[sid]);
    checks[i].textContent=selectedIds[sid]?"✓":"";
  }
}
function updateSelectCount(){
  var cnt=Object.keys(selectedIds).length;
  $("selectCount").textContent=cnt+" selected";
}
function getSelectedItems(){
  return lib.filter(function(m){return selectedIds[m.id]});
}

$("selectCancel").addEventListener("click",exitSelectMode);

$("selectAll").addEventListener("click",function(){
  // get currently visible items
  var visibleCards=grid.querySelectorAll(".card");
  var allSelected=true;
  for(var i=0;i<visibleCards.length;i++){
    var cid=visibleCards[i].getAttribute("data-id");
    if(cid&&!selectedIds[cid]){allSelected=false;break}
  }
  if(allSelected){
    // deselect all
    selectedIds={};
  }else{
    for(var i=0;i<visibleCards.length;i++){

      if(cid) selectedIds[cid]=true;

  updateSelectCount();
  var checks=grid.querySelectorAll(".card-select-check");
  for(var i=0;i<checks.length;i++){
    var sid=checks[i].getAttribute("data-sid");
    checks[i].classList.toggle("on",!!selectedIds[sid]);
    checks[i].textContent=selectedIds[sid]?"✓":"";
  }
});

  var folders=lib.filter(function(m){return m.type==="folder"});
  if(folders.length===0){alert("No folders. Create one first.");return}
  var h='<div class="atf-list">';

    h+='<div class="atf-item" data-fid="'+f.id+'">';
    h+='<div style="width:36px;height:48px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--sf2);border-radius:4px;flex-shrink:0">📁</div>';

    h+='</div>';
  });
  h+='</div>';
  showModal("Move to Folder","Move "+ids.length+" item"+(ids.length>1?"s":"")+":",h,
    '<button class="btn" id="smfCancel">Cancel</button>'
  );
  setTimeout(function(){
    $("smfCancel").addEventListener("click",closeModal);
    var fItems=modBody.querySelectorAll(".atf-item");
    fItems.forEach(function(fi){
      fi.addEventListener("click",function(){
        var fid=this.getAttribute("data-fid");
        var folder=lib.find(function(m){return m.id===fid});
        if(!folder) return;
        folder.children=folder.children||[];
        ids.forEach(function(id){
          if(id!==fid&&folder.children.indexOf(id)<0) folder.children.push(id);
        });
        dbPut(folder).then(function(){
          lib=lib.map(function(m){return m.id===folder.id?folder:m});
          exitSelectMode();closeModal();
        });
      });
    });
  },50);
});

$("selectMarkRead").addEventListener("click",function(){
  var items=getSelectedItems();
  if(items.length===0) return;
  // if all selected are read, mark unread; otherwise mark read
  var allRead=items.every(function(m){return m.read});
  var chain=Promise.resolve();
  items.forEach(function(m){
    m.read=!allRead;
    chain=chain.then(function(){return dbPut(m)});
  });
  chain.then(function(){
    lib=lib.map(function(m){
      if(selectedIds[m.id]){m.read=!allRead}
      return m;
    });
    exitSelectMode();
  });
});

$("selectDelete").addEventListener("click",function(){
  var ids=Object.keys(selectedIds);
  if(ids.length===0) return;
  showModal("Delete "+ids.length+" item"+(ids.length>1?"s":"")+"?",
    "This cannot be undone.","",
    '<button class="btn" id="sdCancel">Cancel</button><button class="btn btn-a" id="sdConfirm">Delete</button>'
  );
  setTimeout(function(){
    $("sdCancel").addEventListener("click",closeModal);
    $("sdConfirm").addEventListener("click",function(){
      var chain=Promise.resolve();
      ids.forEach(function(id){
        chain=chain.then(function(){
          // remove from all folders
          lib.forEach(function(m){
            if(m.type==="folder"&&m.children){
              var before=m.children.length;
              m.children=m.children.filter(function(c){return c!==id});
              if(m.children.length!==before) dbPut(m);
            }
          });
          return dbDel(id);
        });
      });
      chain.then(function(){
        lib=lib.filter(function(m){return !selectedIds[m.id]});
        if(openFolder){
          openFolder.children=(openFolder.children||[]).filter(function(c){return !selectedIds[c]});
        }
        exitSelectMode();closeModal();
        if(typeof updateStorageInfo==="function") updateStorageInfo();
      });
    });
  },50);
});

  {key:"alpha",label:"A–Z"},
  {key:"added",label:"Date Added"},
  {key:"pages",label:"Pages"}
];

function applySortOrder(items){
  var s=sets.sortBy;
  if(s==="custom") return items; // already in sortOrder
  var sorted=items.slice();
  if(s==="alpha"){
    sorted.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"})});
  }else if(s==="added"){
    sorted.sort(function(a,b){return(b.addedAt||0)-(a.addedAt||0)});
  }else if(s==="pages"){
    sorted.sort(function(a,b){
      var ap=a.images?a.images.length:0;
      var bp=b.images?b.images.length:0;
      return bp-ap;
    });
  }
  return sorted;
}

function renderSortPicker(){
  var el=$("sortRow");if(!el)return;
  el.innerHTML="";
  sortOptions.forEach(function(o){
    var btn=document.createElement("button");
    btn.className="btn btn-s"+(sets.sortBy===o.key?" btn-a":"");
    btn.textContent=o.label;
    btn.style.cssText="flex:1;justify-content:center;min-width:0";
    btn.addEventListener("click",function(){
      sets.sortBy=o.key;saveSets();renderSortPicker();renderLib();
    });
    el.appendChild(btn);
  });
}

function addToFolderModal(folder){
  // show all items (manga + folders) not already in this folder, excluding self and ancestors
  var ancestors=getAncestorIds(folder.id);
  var descendants=getDescendantIds(folder.id);
  var mangas=lib.filter(function(m){
    if(m.id===folder.id) return false;          // can't add self
    if(ancestors[m.id]) return false;            // can't add an ancestor (circular)
    if(descendants[m.id]) return false;          // already a descendant
    if((folder.children||[]).indexOf(m.id)>=0) return false; // already direct child
    return true;
  });
  if(mangas.length===0){alert("No titles available to add.");return}
  var selected={};
  var h='<div class="atf-list">';
  mangas.forEach(function(m,i){
    h+='<div class="atf-item" data-mid="'+m.id+'" data-atfi="'+i+'">';
    h+='<img class="atf-img" data-atfi="'+i+'" src="" draggable="false">';
    h+='<div class="atf-name">'+esc(m.name)+'</div>';
    h+='<div class="atf-check" data-mid="'+m.id+'"></div>';
    h+='</div>';
  });
  h+='</div>';
  showModal("Add to "+folder.name,"Select titles to add:",h,
    '<button class="btn" id="atfCancel">Cancel</button><button class="btn btn-a" id="atfDone">Add</button>'
  );
  setTimeout(function(){
    // set cover images
    var atfImgs=modBody.querySelectorAll(".atf-img");
    for(var k=0;k<atfImgs.length;k++){
      var ai=parseInt(atfImgs[k].getAttribute("data-atfi"));
      atfImgs[k].src=getCoverUrl(mangas[ai]);
    }
    var items=modBody.querySelectorAll(".atf-item");
    items.forEach(function(item){
      item.addEventListener("click",function(){
        var mid=this.getAttribute("data-mid");
        var chk=this.querySelector(".atf-check");
        if(selected[mid]){delete selected[mid];chk.classList.remove("on");chk.textContent=""}
        else{selected[mid]=true;chk.classList.add("on");chk.textContent="✓"}
      });
    });
    $("atfCancel").addEventListener("click",closeModal);
    $("atfDone").addEventListener("click",function(){
      var ids=Object.keys(selected);
      if(ids.length===0){closeModal();return}
      folder.children=(folder.children||[]).concat(ids);
      dbPut(folder).then(function(){
        lib=lib.map(function(m){return m.id===folder.id?folder:m});
        renderLib();closeModal();
      });
    });
  },50);
}

  if(!e.dataTransfer.files.length) return;

  // Check if any file is a .koma backup
  var komaFile=null;
  for(var i=0;i<files.length;i++){if(/\.koma$/i.test(files[i].name)){komaFile=files[i];break}}
  if(komaFile) restoreFile(komaFile);
  else processFiles(files);

function processFiles(files){
  pbar.style.display="block";pbar.style.width="0%";
  addBtn.textContent="Importing…";addBtn.disabled=true;

  var arr=Array.from(files);
  // Route .koma backups to restore
  var koma=arr.filter(function(f){return /\.koma$/i.test(f.name)});
  if(koma.length>0){restoreFile(koma[0]);return}
  var imgs=arr.filter(function(f){return f.type.startsWith("image/")});
  var zips=arr.filter(function(f){return /\.(zip|cbz|cbr)$/i.test(f.name)});
  var total=zips.length+(imgs.length>0?1:0);
  var done=0;
  var entries=[];

  function afterAll(){
    // Assign sortOrder to new entries so they appear at the end
    var maxSort=0;
    lib.forEach(function(m){if((m.sortOrder||0)>=maxSort) maxSort=(m.sortOrder||0)+1});
    entries.forEach(function(en,i){en.sortOrder=maxSort+i});
    var chain=Promise.resolve();
    entries.forEach(function(en){chain=chain.then(function(){return dbPut(en)})});
    chain.then(function(){
      entries.forEach(function(en){lib.push(en)});
      renderLib();
      setTimeout(function(){pbar.style.display="none";addBtn.textContent="＋ Add";addBtn.disabled=false},400);
    });
  }

  function processZipAsManga(z,zf,cb){
    var exts=[".jpg",".jpeg",".png",".gif",".webp",".bmp",".avif"];
    var names=Object.keys(z.files).filter(function(n){
      return !z.files[n].dir && exts.some(function(e){return n.toLowerCase().endsWith(e)});
    });
    names.sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true})});
    var images=[];
    function nextImg(j){
      if(j>=names.length){
        if(images.length){
          entries.push({
            id:"m_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),
            name:zf.name.replace(/\.(zip|cbz|cbr)$/i,""),
            images:images,coverBlob:images[0].blob,addedAt:Date.now(),lastPage:0
          });
        }
        cb();
        return;
      }
      z.files[names[j]].async("blob").then(function(blob){
        images.push({name:names[j],blob:blob});
        nextImg(j+1);
      });
    }
    nextImg(0);
  }

  function processNextZip(i){
    if(i>=zips.length){
      if(imgs.length>0) processImgs();
      else afterAll();
      return;
    }
    var zf=zips[i];
    JSZip.loadAsync(zf).then(function(z){
      // If this ZIP contains meta.json, check if it's a Koma backup
      var metaFile=z.file("meta.json");
      if(metaFile){
        metaFile.async("string").then(function(metaStr){
          try{
            var meta=JSON.parse(metaStr);
            // Only treat as backup if meta is an array with Koma-shaped entries (has id + either images/pageNames or type=folder)
            if(Array.isArray(meta)&&meta.length>0&&meta[0].id&&(meta[0].pageNames||meta[0].images||meta[0].type==="folder")){
              restoreFile(zf);
              done++;pbar.style.width=(done/total*100)+"%";
              processNextZip(i+1);
              return;
            }
          }catch(e){}
          // Not a valid Koma backup — treat as normal manga ZIP
          processZipAsManga(z,zf,function(){done++;pbar.style.width=(done/total*100)+"%";processNextZip(i+1)});
        });
        return;
      }
      processZipAsManga(z,zf,function(){done++;pbar.style.width=(done/total*100)+"%";processNextZip(i+1)});
    }).catch(function(){done++;pbar.style.width=(done/total*100)+"%";processNextZip(i+1)});
  }

  function processImgs(){
    imgs.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
    var images=[];
    function next(j){
      if(j>=imgs.length){
        entries.push({
          id:"m_"+Date.now()+"_imgs",
          name:imgs.length===1?imgs[0].name.replace(/\.[^.]+$/,""):"Imported Images",
          images:images,coverBlob:images[0].blob,addedAt:Date.now(),lastPage:0
        });
        pbar.style.width="100%";
        afterAll();
        return;
      }
      // store file as blob directly
      images.push({name:imgs[j].name,blob:imgs[j]});
      next(j+1);
    }
    next(0);
  }

  processNextZip(0);
}

  addBtn.textContent="Backing up…";addBtn.disabled=true;

  var zip=new JSZip();
  var meta=[];
  var total=lib.length;

  for(var i=0;i<lib.length;i++){
    var m=lib[i];
    var entry={id:m.id,name:m.name,type:m.type||"manga",addedAt:m.addedAt,sortOrder:m.sortOrder,lastPage:m.lastPage};
    if(m.type==="folder"){
      entry.children=m.children||[];
    }else{

        var fname=m.id+"/"+j+"_"+(imgs[j].name||"page").replace(/[^a-zA-Z0-9._-]/g,"_");
        entry.pageNames.push(fname);
        // store blob directly or convert legacy data URL
        if(imgs[j].blob){
          zip.file(fname,imgs[j].blob);
        }else if(imgs[j].url){
          var b64data=imgs[j].url.split(",")[1];
          if(b64data) zip.file(fname,b64data,{base64:true});
        }
        // check cover index
        if(m.coverBlob&&m.coverBlob===imgs[j].blob) entry.coverIdx=j;
        else if(m.cover&&imgs[j].url&&m.cover===imgs[j].url) entry.coverIdx=j;
      }
    }
    meta.push(entry);
    pbar.style.width=(5+((i+1)/total)*40)+"%";
  }

  zip.file("meta.json",JSON.stringify(meta));
  pbar.style.width="50%";

    setTimeout(function(){pbar.style.display="none";addBtn.textContent="＋ Add";addBtn.disabled=false},500);
  }).catch(function(err){
    console.error("Backup error:",err);
    alert("Backup failed: "+err.message);

  });

function restoreFile(file){
  pbar.style.display="block";pbar.style.width="5%";
  addBtn.textContent="Restoring…";addBtn.disabled=true;

  JSZip.loadAsync(file).then(function(zip){
    var metaFile=zip.file("meta.json");
    if(!metaFile) throw new Error("No meta.json in backup");
    return metaFile.async("string").then(function(metaStr){
      var meta=JSON.parse(metaStr);
      if(!Array.isArray(meta)) throw new Error("bad meta");
      pbar.style.width="20%";

      var existing={};
      lib.forEach(function(m){existing[m.id]=true});
      var toRestore=meta.filter(function(en){return en.id&&!existing[en.id]});
      var skipped=meta.length-toRestore.length;

      var chain=Promise.resolve();
      toRestore.forEach(function(en,idx){
        chain=chain.then(function(){
          pbar.style.width=(20+((idx+1)/Math.max(toRestore.length,1))*70)+"%";
          if(en.type==="folder"){
            return dbPut({id:en.id,type:"folder",name:en.name,children:en.children||[],addedAt:en.addedAt,sortOrder:en.sortOrder});
          }else{
            var pageNames=en.pageNames||[];
            var images=[];
            var imgChain=Promise.resolve();
            pageNames.forEach(function(pname){
              imgChain=imgChain.then(function(){
                var f=zip.file(pname);
                if(!f) return;
                return f.async("blob").then(function(blob){
                  images.push({name:pname.split("/").pop(),blob:blob});
                });
              });
            });
            return imgChain.then(function(){
              if(images.length===0) return;
              var coverIdx=en.coverIdx||0;
              return dbPut({
                id:en.id,name:en.name,type:"manga",
                images:images,coverBlob:images[Math.min(coverIdx,images.length-1)].blob,
                addedAt:en.addedAt,sortOrder:en.sortOrder,lastPage:en.lastPage||0
              });
            });
          }
        });
      });

      return chain.then(function(){return dbAll()}).then(function(items){
        var hasSortOrder=items.some(function(m){return typeof m.sortOrder==="number"});
        if(hasSortOrder) lib=items.sort(function(a,b){return(a.sortOrder||0)-(b.sortOrder||0)});
        else lib=items.sort(function(a,b){return(b.addedAt||0)-(a.addedAt||0)});
        renderLib();
        pbar.style.width="100%";
        var msg=toRestore.length>0
          ?"Restored "+toRestore.length+" item"+(toRestore.length>1?"s":"")+(skipped>0?" ("+skipped+" already existed)":"")+"."
          :"All items already in library.";
        setTimeout(function(){alert(msg)},300);
        setTimeout(function(){pbar.style.display="none";addBtn.textContent="＋ Add";addBtn.disabled=false},500);
      });
    });
  }).catch(function(zipErr){
    // try legacy JSON format
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var entries=JSON.parse(reader.result);
        if(!Array.isArray(entries)) throw new Error("bad");
        pbar.style.width="30%";
        var existing={};
        lib.forEach(function(m){existing[m.id]=true});
        var toAdd=entries.filter(function(en){return en.id&&(en.images||en.type==="folder")&&!existing[en.id]});
        var skipped=entries.length-toAdd.length;
        var chain=Promise.resolve();
        toAdd.forEach(function(en,i){
          chain=chain.then(function(){
            pbar.style.width=(30+((i+1)/Math.max(toAdd.length,1))*65)+"%";
            return dbPut(en);
          });
        });
        chain.then(function(){return dbAll()}).then(function(items){
          var hasSortOrder=items.some(function(m){return typeof m.sortOrder==="number"});
          if(hasSortOrder) lib=items.sort(function(a,b){return(a.sortOrder||0)-(b.sortOrder||0)});
          else lib=items.sort(function(a,b){return(b.addedAt||0)-(a.addedAt||0)});
          renderLib();
          pbar.style.width="100%";
          var msg=toAdd.length>0
            ?"Restored "+toAdd.length+" item"+(toAdd.length>1?"s":"")+(skipped>0?" ("+skipped+" already existed)":"")+"."
            :"All items already in library.";
          setTimeout(function(){alert(msg)},300);
          setTimeout(function(){pbar.style.display="none";addBtn.textContent="＋ Add";addBtn.disabled=false},500);
        });
      }catch(err){
        alert("Invalid backup file.");
        pbar.style.display="none";addBtn.textContent="＋ Add";addBtn.disabled=false;
      }
    };
    reader.readAsText(file);
  });
}

function updateStorageInfo(){
  var manga=lib.filter(function(m){return m.type!=="folder"});
  var folders=lib.filter(function(m){return m.type==="folder"});
  var totalPages=0;
  manga.forEach(function(m){totalPages+=(m.images?m.images.length:0)});
  var parts=[];
  if(manga.length>0) parts.push(manga.length+" title"+(manga.length!==1?"s":""));
  if(folders.length>0) parts.push(folders.length+" folder"+(folders.length!==1?"s":""));

function startDelete(){
  var isFolder=ctxTgt.type==="folder";
  var inFolder=!!openFolder;

  if(inFolder){
    // inside a folder — offer remove from folder vs permanent delete
    showModal('What to do with "'+ctxTgt.name+'"?',"",
      '<div style="display:flex;flex-direction:column;gap:8px">'
      +'<button class="btn" id="delRemoveFromFolder" style="width:100%;justify-content:center">📤 Remove from this folder only</button>'
      +'<button class="btn btn-a" id="delPermanent" style="width:100%;justify-content:center">🗑 Delete permanently (from all folders)</button>'
      +'</div>',
      '<button class="btn" id="delCancel">Cancel</button>'
    );
    setTimeout(function(){
      $("delCancel").addEventListener("click",closeModal);
      $("delRemoveFromFolder").addEventListener("click",function(){
        removeFromFolder(ctxTgt);
        closeModal();
      });
      $("delPermanent").addEventListener("click",function(){
        // remove from all folders
        lib.forEach(function(m){
          if(m.type==="folder"&&m.children){
            m.children=m.children.filter(function(c){return c!==ctxTgt.id});
            dbPut(m);
          }
        });
        if(openFolder) openFolder.children=(openFolder.children||[]).filter(function(c){return c!==ctxTgt.id});
        dbDel(ctxTgt.id).then(function(){
          lib=lib.filter(function(m){return m.id!==ctxTgt.id});
          renderLib();if(typeof updateStorageInfo==="function")updateStorageInfo();closeModal();
        });
      });
    },50);
  }else{
    var msg=isFolder?"This removes the folder (titles inside are kept).":"This removes it permanently from all folders.";
    showModal('Delete "'+ctxTgt.name+'"?',msg,"",
      '<button class="btn" id="delCancel">Cancel</button><button class="btn btn-a" id="delConfirm">Delete</button>'
    );
    setTimeout(function(){
      $("delCancel").addEventListener("click",closeModal);
      $("delConfirm").addEventListener("click",function(){
        if(openFolder&&openFolder.id===ctxTgt.id) openFolder=null;
        if(!isFolder){
          // remove from all folders
          lib.forEach(function(m){
            if(m.type==="folder"&&m.children){
              m.children=m.children.filter(function(c){return c!==ctxTgt.id});
              dbPut(m);
            }
          });
        }
        dbDel(ctxTgt.id).then(function(){
          lib=lib.filter(function(m){return m.id!==ctxTgt.id});
          renderLib();if(typeof updateStorageInfo==="function")updateStorageInfo();closeModal();
        });
      });
    },50);
  }
}

function renderManagePages(){
  var m=managePagesTarget;
  if(!m||!m.images)return;
  var total=m.images.length;
  var h='<div style="margin-bottom:10px"><button class="btn btn-s" id="mpAddPages" style="width:100%">＋ Add pages from phone</button></div>';

    h+='<div class="pg-name">'+esc(m.images[i].name)+'</div>';
    h+='<button class="pg-move'+(i===0?' dis':'')+'" data-dir="-1" data-pi="'+i+'" title="Move up">▲</button>';
    h+='<button class="pg-move'+(i===total-1?' dis':'')+'" data-dir="1" data-pi="'+i+'" title="Move down">▼</button>';
    h+='<button class="pg-rm" data-pi="'+i+'" title="Remove">✕</button>';
    h+='</div>';
  }
  h+='</div>';
  showModal("Manage Pages",""+total+" page"+(total!==1?"s":""),h,
    '<button class="btn" id="mpDone">Done</button>'
  );
  setTimeout(function(){
    // set page images
    var mpImgs=modBody.querySelectorAll(".mp-img");
    for(var k=0;k<mpImgs.length;k++){
      var mpi=parseInt(mpImgs[k].getAttribute("data-mpi"));
      mpImgs[k].src=getImageUrl(m.images[mpi]);
    }
    $("mpDone").addEventListener("click",function(){
      managePagesTarget=null;
      closeModal();
      renderLib();
    });
    $("mpAddPages").addEventListener("click",function(){
      addPagesInput.click();
    });
    var rmBtns=modBody.querySelectorAll(".pg-rm");
    for(var j=0;j<rmBtns.length;j++){
      rmBtns[j].addEventListener("click",function(ev){
        ev.stopPropagation();
        var pi=parseInt(this.getAttribute("data-pi"));
        removePage(pi);
      });
    }
    var moveBtns=modBody.querySelectorAll(".pg-move:not(.dis)");
    for(var j=0;j<moveBtns.length;j++){
      moveBtns[j].addEventListener("click",function(ev){
        ev.stopPropagation();
        var pi=parseInt(this.getAttribute("data-pi"));
        var dir=parseInt(this.getAttribute("data-dir"));
        movePage(pi,dir);
      });
    }
  },50);
}

function removePage(pi){
  var m=managePagesTarget;
  if(!m||!m.images||m.images.length<=1){alert("Can't remove the last page.");return}
  m.images.splice(pi,1);
  if(pi===0&&m.images.length>0) m.coverBlob=m.images[0].blob||null;
  if(m.lastPage>=m.images.length) m.lastPage=m.images.length-1;
  dbPut(m).then(function(){
    lib=lib.map(function(x){return x.id===m.id?m:x});
    renderManagePages();
  });
}

function movePage(pi,dir){
  var m=managePagesTarget;
  if(!m||!m.images)return;
  var newIdx=pi+dir;
  if(newIdx<0||newIdx>=m.images.length)return;
  var temp=m.images[pi];
  m.images[pi]=m.images[newIdx];
  m.images[newIdx]=temp;
  // update cover to first page
  m.coverBlob=m.images[0].blob||null;
  dbPut(m).then(function(){
    lib=lib.map(function(x){return x.id===m.id?m:x});
    renderManagePages();
  });
}

addPagesInput.addEventListener("change",function(e){
  if(!e.target.files.length||!managePagesTarget)return;
  var files=Array.from(e.target.files);
  files.sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
  var m=managePagesTarget;
  files.forEach(function(f){
    m.images.push({name:f.name,blob:f});
  });
  dbPut(m).then(function(){
    lib=lib.map(function(x){return x.id===m.id?m:x});
    renderManagePages();
    renderLib();
  });
  e.target.value="";
});

/* reader taps */
var tapTimer=null;
pageArea.addEventListener("click",function(e){
  if(swipeHandled) return;
  var now=Date.now();
  var dx=Math.abs(e.clientX-lastTapX);
  var dy=Math.abs(e.clientY-lastTapY);
  // Double-tap detection: within 300ms and 40px of last tap
  if(now-lastTapTime<300 && dx<40 && dy<40){
    clearTimeout(tapTimer);tapTimer=null;
    lastTapTime=0;
    // Double-tap: toggle zoom at tap position
    if(zm>1){
      resetZm();renderPage();
    }else{
      var rect=pageArea.getBoundingClientRect();
      var imgRect=pageImg.getBoundingClientRect();
      // Zoom to 2.5x centered on tap point
      zm=2.5;
      var cx=e.clientX-imgRect.left-imgRect.width/2;
      var cy=e.clientY-imgRect.top-imgRect.height/2;
      px=-cx*(zm-1);py=-cy*(zm-1);
      lpx=px;lpy=py;
      renderPage();
    }
    return;
  }
  lastTapTime=now;lastTapX=e.clientX;lastTapY=e.clientY;
  // Delay single-tap actions to wait for potential double-tap
  tapTimer=setTimeout(function(){
    tapTimer=null;
    if(zm>1){toggleUI();return}
    var rect=pageArea.getBoundingClientRect();
    var x=e.clientX-rect.left;
    var third=rect.width/3;
    if(x<third) goPage(-1);
    else if(x>third*2) goPage(1);
    else toggleUI();
  },300);
});
scrollArea.addEventListener("click",function(e){
  var t=e.target,spi=t.getAttribute?t.getAttribute("data-spi"):null;
  if(spi!==null&&spi!==""){pg=parseInt(spi);savePg();sets.mode="page";resetZm();applyMode();}
  else toggleUI();
});

function toggleUI(){
  uiVis=!uiVis;
  rTop.classList.toggle("hid",!uiVis);
  rBot.classList.toggle("hid",!uiVis);
  clearTimeout(uiTmr);
  if(uiVis) uiTmr=setTimeout(function(){uiVis=false;rTop.classList.add("hid");rBot.classList.add("hid")},4000);
}

rTop.addEventListener("click",function(e){e.stopPropagation()});
rBot.addEventListener("click",function(e){e.stopPropagation()});

/* pinch, pan & swipe */
pageArea.addEventListener("touchstart",function(e){
  if(e.touches.length===2){
    pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    pinchZ=zm;
    swiping=false;
  }else if(e.touches.length===1){
    if(zm>1){
      panning=true;panSX=e.touches[0].clientX;panSY=e.touches[0].clientY;
    }else{
      swipeStartX=e.touches[0].clientX;
      swipeStartY=e.touches[0].clientY;
      swiping=true;swipeHandled=false;
    }
  }
},{passive:true});

pageArea.addEventListener("touchmove",function(e){
  if(e.touches.length===2&&pinchD){
    e.preventDefault();
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zm=Math.max(1,Math.min(5,pinchZ*(d/pinchD)));
    if(zm<=1)resetZm();
    pageImg.classList.add("notrans");
    pageImg.style.transform="scale("+zm+") translate("+(px/zm)+"px,"+(py/zm)+"px)";
    pageArea.classList.toggle("zoomed",zm>1);
  }else if(e.touches.length===1&&panning&&zm>1){
    e.preventDefault();
    px=lpx+e.touches[0].clientX-panSX;
    py=lpy+e.touches[0].clientY-panSY;
    pageImg.classList.add("notrans");
    pageImg.style.transform="scale("+zm+") translate("+(px/zm)+"px,"+(py/zm)+"px)";
  }else if(e.touches.length===1&&swiping&&!swipeHandled&&zm<=1){
    var dx=e.touches[0].clientX-swipeStartX;
    var dy=e.touches[0].clientY-swipeStartY;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){
      e.preventDefault();
      swipeHandled=true;
      if(dx>0) goPage(-1);
      else goPage(1);
    }
  }
},{passive:false});

pageArea.addEventListener("touchend",function(e){
  pageImg.classList.remove("notrans");
  if(pinchD&&e.touches.length<2){pinchD=null;if(zm<=1){resetZm();renderPage()}}
  if(panning&&e.touches.length===0){lpx=px;lpy=py;panning=false}
  if(swiping&&e.touches.length===0){swiping=false}
},{passive:true});

/* keyboard + scroll wheel */
document.addEventListener("keydown",function(e){
  if(!cur||sets.mode==="vertical"||sets.mode==="grid")return;
  if(e.key==="ArrowRight")goPage(1);
  else if(e.key==="ArrowLeft")goPage(-1);
  else if(e.key==="Escape")closeReader();
});

var wheelCooldown=false;
pageArea.addEventListener("wheel",function(e){
  if(!cur||sets.mode!=="page"||wheelCooldown)return;
  if(zm>1)return; // let normal scroll work when zoomed
  e.preventDefault();
  wheelCooldown=true;
  if(e.deltaY>0) goPage(1);
  else if(e.deltaY<0) goPage(-1);
  setTimeout(function(){wheelCooldown=false},200);
},{passive:false});

/* ═══ START ═══ */
init();

})();
</script>
</body>
</html>
